<style>
/* Layout: invitation card hero (her background) → stacked scalloped category cards → sticky confirm bar. One soft-blue world, single theme by choice. */
:root{
  --sky:#f3dbe4;       /* page ground, from the frame */
  --sky-deep:#e4b9c9;
  --paper:#fefbfc;     /* card paper */
  --ink:#683d4d;       /* body text, blue-slate */
  --ink-soft:#966e7d;
  --ribbon:#c67f99;    /* accent: satin ribbon blue */
  --ribbon-deep:#a95b78;
  --cream:#efe4cf;     /* bear / moon cream */
  --taken:#c2a8b2;
  --ok:#5f8f73;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Mulish","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 12% 8%,#f8e9ee 0,transparent 38%),radial-gradient(circle at 90% 60%,#f8e6ed 0,transparent 35%);
  background-attachment:fixed}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:20px 140px;display:flex;flex-direction:column;gap:22px}

  box-shadow:0 18px 40px -20px rgba(104,61,77,.45);display:flex;align-items:center;justify-content:center}
.hero-in{text-align:center;padding:0 18%;display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:-6%}
.eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ribbon-deep);font-weight:700}
.hero h1{font-family:var(--f-script);font-weight:400;font-size:clamp(3rem,13vw,5rem);line-height:1;color:var(--ribbon-deep);margin:6px 0 0}
.hero h2{font-family:var(--f-display);font-weight:500;font-style:italic;font-size:clamp(1.3rem,5vw,1.8rem);margin:0;color:var(--ink);text-wrap:balance}
.rule{display:flex;align-items:center;gap:10px;color:var(--ribbon);margin:8px 0}
.rule::before,.rule::after{content:"";width:46px;height:1px;background:currentColor;opacity:.6}
.hero p{margin:0;font-size:.92rem;color:var(--ink-soft);max-width:30ch;text-wrap:balance}
.hero .moon{position:absolute;top:7%;right:9%;width:17%}
.hero .balloons{position:absolute;right:5%;bottom:4%;width:16%;animation:float 6s ease-in-out infinite}
.hero .moon{top:10%;right:5%;width:19%}
.hero .balloons{right:4%;bottom:2.5%;width:14%}
.hero .bear{position:absolute;left:0;bottom:0;width:27%}
.hero .hero-in{margin-top:-17%}
@media(max-width:400px){.hero h1{font-size:2.9rem}.hero h2{font-size:1.15rem}.hero p{font-size:.82rem}.how{font-size:.76rem}.hero .hero-in{margin-top:-5%;padding:0 12%}.hero .bear{width:21%}}
.hero .fly{position:absolute;top:21%;left:7%;width:11%;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
.how{margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--ink-soft)}
.how b{color:var(--ink);font-weight:600}

/* Progress */
.progress{background:var(--paper);border-radius:999px;padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px -14px rgba(104,61,77,.5)}
.progress .bar{flex:1;height:8px;border-radius:9px;background:var(--sky);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ribbon),var(--ribbon-deep));border-radius:9px;transition:width .6s}
.progress span{font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.notice{background:#fff7e6;color:#7a5a20;border-radius:14px;padding:10px 14px;font-size:.85rem}

/* Category card */
.cat{position:relative;background:var(--paper);border-radius:28px;padding:26px 20px 16px;
  box-shadow:0 14px 34px -22px rgba(104,61,77,.55);border:1px solid #f7e7ed}
.cat::before{content:"";position:absolute;inset:7px;border:1.5px dashed #eccfda;border-radius:22px;pointer-events:none}
.cat header{display:flex;align-items:flex-end;gap:12px;padding-right:70px;margin-bottom:8px}
.cat .n{font-family:var(--f-display);font-size:2.4rem;line-height:.8;color:var(--sky-deep);font-weight:600}
.cat h3{font-family:var(--f-display);font-size:1.45rem;font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
.cat .deco{position:absolute;top:-18px;right:10px;width:78px;height:auto;filter:drop-shadow(0 6px 8px rgba(104,61,77,.18))}
ul{list-style:none;margin:0;padding:0}
.item{border-top:1px solid #f8edf1}
.item:first-child{border-top:0}
.item label{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;border-radius:12px}
.item label:hover{background:#fcf3f6}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:1.6px solid var(--ribbon);display:grid;place-items:center;background:#fff;transition:.2s}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:.2s}
.item input:checked + .box{background:var(--ribbon);border-color:var(--ribbon)}
.item input:checked + .box svg{opacity:1;transform:none}
.item input:focus-visible + .box{outline:2px solid var(--ribbon-deep);outline-offset:3px}
.num{flex:none;width:38px;font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1;color:var(--ribbon-deep);font-variant-numeric:tabular-nums;text-align:right}
.txt{flex:1;min-width:0}
.txt small{display:block;font-size:.75rem;color:var(--ink-soft);letter-spacing:.04em}
.item.taken label{cursor:default}
.item.taken label:hover{background:none}
.item.taken .txt>span{text-decoration:line-through;text-decoration-color:var(--ribbon);text-decoration-thickness:1.5px;color:var(--taken)}
.item.taken .box{border-color:var(--taken);background:#f7eef1}
.item.taken .num{color:var(--taken)}
.chip{display:inline-flex;align-items:center;gap:5px;margin-top:3px;font-size:.75rem;font-weight:600;color:var(--ribbon-deep);background:#faeaf0;border-radius:999px;padding:2px 10px}
.chip button{border:0;background:none;color:var(--ink-soft);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0 0 0 4px}
.tag{flex:none;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--taken)}

.foot{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.foot img{width:170px;position:relative;z-index:1;margin-bottom:-46px;filter:drop-shadow(0 8px 10px rgba(104,61,77,.18))}
.ledge{width:100%;background:var(--paper);border-radius:28px;padding:58px 20px 24px;box-shadow:0 14px 34px -22px rgba(104,61,77,.55);border:1px solid #f7e7ed;text-align:center}
.foot p{font-family:var(--f-display);font-style:italic;font-size:1.3rem;margin:0}
.ahead .ledge{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:56px}

/* Sticky confirm bar */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.dock .in{pointer-events:auto;width:100%;max-width:620px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 30px -12px rgba(60,30,41,.6);transform:translateY(140%);transition:transform .35s}
.dock.on .in{transform:none}
.dock .in span{flex:1;font-size:.9rem}
.btn{border:0;border-radius:14px;padding:12px 18px;font:700 .92rem var(--f-body);cursor:pointer;background:var(--ribbon);color:#fff}
.btn:hover{background:var(--ribbon-deep)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid #ecd6de}

/* Sheet */
.veil{position:fixed;inset:0;background:rgba(72,40,52,.4);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.sheet{width:100%;max-width:520px;background:var(--paper);border-radius:26px;padding:26px 22px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;position:relative;max-height:88vh;overflow:auto}
.sheet .bow{position:absolute;top:-36px;left:50%;transform:translateX(-50%);width:84px}
.sheet h4{font-family:var(--f-display);font-size:1.6rem;margin:16px 0 0;text-align:center;font-weight:600}
.sheet ol{margin:0;padding-left:20px;font-size:.9rem;color:var(--ink-soft)}
.sheet label{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.sheet input{width:100%;font:500 1rem var(--f-body);padding:13px 14px;border-radius:14px;border:1.5px solid #ecd6de;background:#fff;color:var(--ink);margin-top:6px}
.sheet input:focus{outline:none;border-color:var(--ribbon)}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.err{color:#a5483f;font-size:.85rem;margin:0}
.thanks{text-align:center}
.thanks img{width:120px;margin:0 auto}
.love{font-family:var(--f-display);font-style:italic;font-size:1.2rem;line-height:1.45;color:var(--ink);margin:0 auto;max-width:32ch;text-wrap:balance}

/* Host view */
.host .cat header{padding-right:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--ribbon-deep);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.person{padding:12px 0;border-top:1px solid #f8edf1}
.person:first-child{border-top:0}
.person h5{margin:0 0 4px;font-size:1rem;display:flex;justify-content:space-between;gap:8px}
.person h5 small{color:var(--ink-soft);font-weight:600}
.person li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem;padding:3px 0}
.linkbtn{border:0;background:none;color:var(--ribbon-deep);font:600 .78rem var(--f-body);text-decoration:underline;cursor:pointer;flex:none}
.pending li{font-size:.88rem;padding:3px 0;color:var(--ink-soft)}
.switch{text-align:center;font-size:.85rem}
.switch a{color:var(--ribbon-deep);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.cat .deco{width:62px}.hero-in{padding:0 14%}}

.hint{margin:-6px 0 0;font-size:.8rem;color:var(--ink-soft)}
.ahead .script{font-family:var(--f-script);font-weight:400;font-size:3.2rem;line-height:1;color:var(--ribbon-deep);margin:4px 0 0}
.ahead h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.5rem;margin:0}
.gate{display:flex;flex-direction:column;gap:10px}
.gate label{font-size:.85rem;color:var(--ink-soft)}
.gate input{width:100%;font:600 1.05rem var(--f-body);letter-spacing:.08em;padding:13px 14px;border-radius:14px;border:1.5px solid #ecd6de;background:#fff;color:var(--ink)}
.gate input:focus{outline:none;border-color:var(--ribbon)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid #ecd6de;background:var(--paper);color:var(--ink);font:600 .85rem var(--f-body);padding:9px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.ghost{margin-left:auto;color:var(--ribbon-deep)}
.arow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid #f8edf1}
.arow:first-child{border-top:0}
.arow.is-taken .txt>span:first-child{color:var(--ink)}
.free{color:var(--ok)!important;font-weight:600}
.who{display:block;margin-top:3px;font-size:.9rem;color:var(--ribbon-deep)}
.who b{color:var(--ink);font-weight:700}
.arow.is-taken{background:#fcf3f6;border-radius:12px;padding-inline:8px}
.muted{color:var(--ink-soft);margin:6px 0 10px}
.ico{flex:none;width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(120,60,80,.16))}
.item.taken .ico{filter:grayscale(1);opacity:.4}
.num{width:30px}
@media (max-width:380px){.ico{width:46px;height:46px}.item label{gap:9px}.num{width:26px;font-size:1.4rem}}
</style>

let n=0;const ALL=[];CATS.forEach((c,ci)=>c.items.forEach(it=>{n++;ALL.push({id:it[0],name:it[1],sub:it[2]||"",num:n,cat:ci})}));
const BYID=Object.fromEntries(ALL.map(i=>[i.id,i]));
const CHECK='<svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SB_URL="https://nsujtmfmyoeibbvwkzez.supabase.co";
const SB_KEY="sb_publishable_vngm39TRXt50jchjL2_gGQ_kZIl_n_P";
const EVENT="baby-shower-2";
async function rpc(fn,body){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

let taken=new Set(), selected=new Set(), state="loading";
const $=id=>document.getElementById(id);

function render(){
  const t=ALL.filter(i=>taken.has(i.id)).length;
  let h="";
  if(state==="error")h+=`<div class="notice">No pudimos cargar la lista. Revisa tu conexión y recarga la página.</div>`;
  h+=`<div class="progress"><div class="bar"><i style="width:${(t/ALL.length*100).toFixed(1)}%"></i></div><span>${state==="loading"?"Cargando…":`${t} de ${ALL.length} regalos apartados`}</span></div>`;
  CATS.forEach((c,ci)=>{
    h+=`<section class="cat"><img class="deco" src="${IMG[c.deco]}" alt=""><header><span class="n">${ci+1}</span><h3>${c.t}</h3></header><ul>`;
    ALL.filter(i=>i.cat===ci).forEach(i=>{
      if(taken.has(i.id)){
        h+=`<li class="item taken"><label><input type="checkbox" disabled><span class="box"></span><span class="num">${i.num}</span>${ico(i.id)}<span class="txt"><span>${esc(i.name)}</span>${i.sub?`<small>${i.sub}</small>`:""}</span><span class="tag">Cogido</span></label></li>`;
      }else{
        h+=`<li class="item"><label><input type="checkbox" id="c-${i.id}" data-id="${i.id}" ${selected.has(i.id)?"checked":""} ${state!=="on"?"disabled":""}><span class="box">${CHECK}</span><span class="num">${i.num}</span>${ico(i.id)}<span class="txt"><span>${esc(i.name)}</span>${i.sub?`<small>${i.sub}</small>`:""}</span></label></li>`;
      }
    });
    h+=`</ul></section>`;
  });
  h+=`<div class="foot"><img src="${IMG.peek}" alt=""><div class="ledge"><p>¡Gracias por consentir a la bebé!</p></div></div>`;
  $("body").innerHTML=h;
  updateDock();
}
function updateDock(){
  [...selected].forEach(id=>{if(taken.has(id))selected.delete(id)});
  const k=selected.size;$("dock").classList.toggle("on",k>0);
  $("dockTxt").textContent=k===1?"1 regalo elegido":`${k} regalos elegidos`;
}
document.addEventListener("change",e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;e.target.checked?selected.add(id):selected.delete(id);updateDock()});

async function load(){
  try{const ids=await rpc("regalos_get_claimed",{p_event:EVENT});taken=new Set(ids);state="on"}
  catch(e){if(state==="loading")state="error"}
  if($("veil").hidden)render();
}

$("dockBtn").onclick=openSheet;
let savedName="";try{savedName=localStorage.getItem("bs-name-"+EVENT)||""}catch(e){}
function openSheet(){
  const list=[...selected].map(id=>BYID[id]).sort((a,b)=>a.num-b.num);
  $("veil").innerHTML=`<form class="sheet" id="sheet"><img class="bow" src="${IMG.bow}" alt=""><h4>Confirma tus regalos</h4><ol>${list.map(i=>`<li>${esc(i.name)}${i.sub?` · ${i.sub}`:""}</li>`).join("")}</ol><div><label for="nm">Tu nombre</label><input id="nm" autocomplete="name" maxlength="60" placeholder="Ej. Tía Carmen" value="${esc(savedName)}"></div><p class="hint">Tu nombre solo lo verá la anfitriona.</p><p class="err" id="err" hidden></p><div class="row"><button class="btn ghost" type="button" id="cancel">Volver</button><button class="btn" type="submit" id="ok">Confirmar</button></div></form>`;
  $("veil").hidden=false;setTimeout(()=>$("nm").focus(),50);
  $("cancel").onclick=closeSheet;
  $("sheet").onsubmit=async ev=>{
    ev.preventDefault();const name=$("nm").value.trim();const err=$("err");
    if(!name){err.textContent="Escribe tu nombre para que la anfitriona sepa quién lo regala.";err.hidden=false;return}
    $("ok").disabled=true;$("ok").textContent="Guardando…";
    try{localStorage.setItem("bs-name-"+EVENT,name)}catch(e){}savedName=name;
    let res;
    try{res=await rpc("regalos_claim",{p_event:EVENT,p_item_ids:list.map(i=>i.id),p_name:name})}
    catch(e){err.textContent="No se pudo guardar. Revisa tu conexión e intenta otra vez.";err.hidden=false;$("ok").disabled=false;$("ok").textContent="Confirmar";return}
    if(!res||!res.ok){err.textContent="Revisa tu nombre e intenta otra vez.";err.hidden=false;$("ok").disabled=false;$("ok").textContent="Confirmar";return}
    const done=(res.claimed||[]).map(id=>BYID[id]).filter(Boolean);
    const lost=(res.taken||[]).map(id=>BYID[id]).filter(Boolean);
    done.concat(lost).forEach(i=>taken.add(i.id));
    selected.clear();
    $("veil").innerHTML=`<div class="sheet thanks"><img src="${IMG.heart}" alt=""><h4>¡Gracias, ${esc(name)}!</h4>${done.length?`<p class="love">${done.length===1?"Tu regalo":"Tus regalos"} ya ${done.length===1?"tiene":"tienen"} un lugar especial esperando al bebé. Cada detalle hecho con cariño se convierte en un abrazo para esta nueva vida. ¡Gracias por ser parte de este momento tan bonito! ♡</p>`:""}${lost.length?`<p class="err">Alguien más eligió antes: ${lost.map(i=>esc(i.name)+(i.sub?" ("+i.sub+")":"")).join(", ")}. Puedes elegir otro.</p>`:""}<button class="btn" type="button" id="cl">Listo</button></div>`;
    $("cl").onclick=closeSheet;
  };
}
function closeSheet(){$("veil").hidden=true;$("veil").innerHTML="";render()}
$("veil").addEventListener("click",e=>{if(e.target.id==="veil")closeSheet()});

render();load();setInterval(load,10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
